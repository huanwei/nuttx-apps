# ORT 部署 manifest —— 监督者启动时加载并校验
#
# 改这个文件不需要重新编译固件。这就是"编排"与"把配置烧进二进制"的区别。
# 格式说明与校验规则见 ortsup_main.c 的 Manifest 一节。

version = 1
startup_timeout_ms = 1500

# 非关键 CG：失效只降级，允许有限次重启
# revision = 本 CG 的版本号。状态快照跨版本不交接 —— 见 ortsup 的说明。
#   （刻意不叫 version：全局那个 version 是 manifest 格式版本。）
[app_cg]
revision = 1
domain = 1
critical = false
max_restarts = 2
handles_fault = false

# 关键 CG：失效即进安全态，不重启（SAFE_STATIC 推荐 NEVER）
[safety_cg]
revision = 1
domain = 2
critical = true
max_restarts = 0
handles_fault = false
